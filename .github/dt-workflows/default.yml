# DevTrees workflow smoke test.
#
# This workflow is intentionally read-only. It exercises typed inputs, a set
# step, a Copilot ACP agent, a human gate, directed routes, and explicit
# success/failure termination without modifying the repository.

workflow:
  name: devtrees-default
  description: Verify the DevTrees directed-workflow runtime and live graph.
  version: "1.0.0"
  entry_point: prepare

  input:
    objective:
      type: string
      description: The repository question for Copilot to investigate.
      default: Summarize this repository's architecture and identify one useful improvement.

  runtime:
    provider: copilot

  limits:
    max_iterations: 8
    timeout_seconds: 900

agents:
  - name: prepare
    type: set
    description: Build the read-only investigation request.
    values:
      objective: "{{ workflow.input.objective }}"
      instruction: Do not edit files, run destructive commands, or create commits.
    routes:
      - to: investigate

  - name: investigate
    type: agent
    description: Inspect the selected worktree with GitHub Copilot ACP.
    prompt: |
      Investigate the current repository and respond in concise Markdown.

      Objective:
      {{ prepare.output.objective }}

      Safety constraint:
      {{ prepare.output.instruction }}

      Include:
      - the main application architecture;
      - the most relevant files you inspected;
      - one concrete, low-risk improvement;
      - any uncertainty that prevented a firm conclusion.
    routes:
      - to: review

  - name: review
    type: human_gate
    description: Confirm whether the workflow result is acceptable.
    prompt: |
      ## Review the smoke-test result

      {{ investigate.output.result }}

      Choose **Accept result** to complete successfully or **Reject result** to
      exercise the failure route.
    options:
      - label: Accept result
        value: accepted
        route: complete
      - label: Reject result
        value: rejected
        route: rejected

  - name: complete
    type: terminate
    description: Finish the smoke test successfully.
    status: success
    reason: The user accepted the Copilot investigation.
    output_template:
      result: accepted
      report: "{{ investigate.output.result }}"

  - name: rejected
    type: terminate
    description: Finish through the explicit failure path.
    status: failed
    reason: The user rejected the Copilot investigation.
    output_template:
      result: rejected
      report: "{{ investigate.output.result }}"

output:
  result: "{{ investigate.output.result }}"
